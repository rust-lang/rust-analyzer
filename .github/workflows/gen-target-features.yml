name: Generate target feature implications

on:
  workflow_dispatch:
  schedule:
    - cron: '50 23 * * 6'

defaults:
  run:
    shell: bash

jobs:
  lints-gen:
    if: ${{ github.repository == 'rust-lang/rust-analyzer' || github.event_name == 'workflow_dispatch' }}
    name: Generate target feature implications
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install nightly
        run: rustup default nightly

      - name: Generate implications
        run: cargo codegen target-features

      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Submit PR
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "internal: update target feature implications"
          branch: "ci/gen-target-features"
          delete-branch: true
          sign-commits: true
          title: "Update target feature implications"
          body: "Weekly target feature updates for `crates/hir-ty/src/generated/target_features.rs`."
          labels: "A-infra"
