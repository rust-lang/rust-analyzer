[package]
name = "proc-macro-srv"
version = "0.0.0"
repository.workspace = true
description = "Proc-macro server for rust-analyzer."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
temp-dir.workspace = true

paths.workspace = true
# span = {workspace = true, default-features = false} does not work
span = { path = "../span", version = "0.0.0", default-features = false }
intern.workspace = true
tt = { path = "../tt", version = "0.0.0", default-features = false }
proc-macro-api = { path = "../proc-macro-api", version = "0.0.0", default-features = false, features = [
    "in-proc-macro-srv",
] }

[dev-dependencies]
expect-test.workspace = true
line-index.workspace = true

# used as proc macro test targets
proc-macro-test.path = "./proc-macro-test"

[features]
default = []
in-rust-tree = ["tt/in-rust-tree", "proc-macro-api/in-rust-tree"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
