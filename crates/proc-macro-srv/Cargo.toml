[package]
name = "proc-macro-srv"
version = "0.0.0"
repository.workspace = true
description = "Proc-macro server for rust-analyzer."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
paths = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
# span = {workspace = true, default-features = false} does not work
span = { path = "../span", version = "0.0.0", default-features = false , optional = true }
intern = { workspace = true, optional = true }
tt = { path = "../tt", version = "0.0.0", default-features = false }
proc-macro-api = { path = "../proc-macro-api", version = "0.0.0", default-features = false, features = [
    "in-proc-macro-srv",
] }
stdx = { workspace = true, optional = true }

[dev-dependencies]
expect-test.workspace = true
line-index.workspace = true

# used as proc macro test targets
proc-macro-test.path = "./proc-macro-test"

[features]
default = []
in-rust-tree = ["dep:intern", "dep:paths", "dep:rustc-hash", "dep:span", "dep:stdx", "tt/in-rust-tree", "proc-macro-api/in-rust-tree"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private = true
