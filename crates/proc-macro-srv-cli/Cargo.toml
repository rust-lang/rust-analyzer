[package]
name = "proc-macro-srv-cli"
version = "0.0.0"
repository.workspace = true
description = "A standalone binary for the `proc-macro-srv` crate of rust-analyzer."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
proc-macro-srv.workspace = true
proc-macro-api = { path = "../proc-macro-api", version = "0.0.0", default-features = false, features = [
    "in-proc-macro-srv",
] }
clap = { version = "4.5.42", default-features = false, features = ["std"] }
# span = { workspace = true, default-features = false } does not work
span = { path = "../span", version = "0.0.0", default-features = false }

[dev-dependencies]
expect-test.workspace = true
paths.workspace = true
intern.workspace = true

# used as proc macro test target
proc-macro-test.path = "../proc-macro-srv/proc-macro-test"

# Enable the in-ra feature for tests.
proc-macro-api = { path = "../proc-macro-api", default-features = false, features = [
    "in-proc-macro-srv",
    "in-ra",
] }
tt.workspace = true

[features]
default = []
# default = ["in-rust-tree"]
in-rust-tree = ["proc-macro-srv/in-rust-tree", "proc-macro-api/in-rust-tree"]

[[bin]]
name = "rust-analyzer-proc-macro-srv"
path = "src/main.rs"

[lints]
workspace = true
